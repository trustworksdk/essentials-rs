# Mounted at /etc/gateway/gateway.yaml, layered over the built-in defaults (payment-gateway/config/default.yaml).
clock:
  mode: virtual
  start: "2030-01-07T08:00:00Z"
  running: false
  speed: 1440
payments:
  # Every payment completes and none is returned, so the clean run reconciles exactly. Raise these to see failures
  # and returns.
  deposit: { fail_probability: 0.0, min_delay_seconds: 60, max_delay_seconds: 1800 }
  withdrawal: { fail_probability: 0.0, min_delay_seconds: 600, max_delay_seconds: 14400 }
  return_probability: 0.0
statement:
  cutoff: "17:30"
  time_zone: Europe/Copenhagen
  opening_balances: { DKK: "1000000.00" }
test_control:
  enabled: true
webhooks:
  subscriptions:
    - name: payments
      url: http://receiver:9000/hooks/gateway
      event_types: [PaymentPending, PaymentCompleted, PaymentFailed, PaymentReturned, BankStatementIssued]
      secret_file: /run/secrets/webhook_secret
      ordered: true
