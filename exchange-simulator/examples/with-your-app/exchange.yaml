# Mounted at /etc/exchange/exchange.yaml, layered over the built-in defaults (config/default.yaml).
clock:
  # A virtual clock running in real time. The gateway follows it; your app can speed it up, freeze and resume it
  # through /api/clock (operator_control).
  mode: virtual
  running: true
  speed: 1
  operator_control: true
# A market your app can trade against without any key: synthetic prices, and the liquidity provider quoting each
# instrument. For live prices, set kind: finnhub, FINNHUB_API_KEY, and take instruments from
# config/finnhub-market.yaml.
price_sources:
  default: { kind: synthetic, volatility: 0.3 }
liquidity:
  default: { mode: on, levels: 5, spread_bps: 5, level_quantity: 100 }
instruments:
  - { id: AAPL, symbol: AAPL, mic: XNAS, currency: USD, currency_scale: 2, price_source: { initial_price: "187.50" } }
  - { id: MSFT, symbol: MSFT, mic: XNAS, currency: USD, currency_scale: 2, price_source: { initial_price: "410.00" } }
  - { id: NVDA, symbol: NVDA, mic: XNAS, currency: USD, currency_scale: 2, price_source: { initial_price: "135.00" } }
settlement:
  mode: simulated
clearing:
  enabled: true
  cutoff: "17:30"
  time_zone: Europe/Copenhagen
webhooks:
  subscriptions:
    - name: app
      url: http://app:9000/hooks/exchange
      event_types: [OrderAccepted, OrderRejected, OrderFilled, OrderPartiallyFilled, OrderCancelled, TradeExecuted,
                    SettlementPending, SettlementCompleted, SettlementFailed, SettlementDelayed,
                    ClearingStatementIssued, BusinessDayClosed]
      secret_file: /run/secrets/webhook_secret
      ordered: true
