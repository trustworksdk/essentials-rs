# Built-in defaults, compiled into the binary. Override with a file named by EXCHANGE_CONFIG and/or environment
# variables prefixed EXCHANGE__ with `__` between levels, e.g. EXCHANGE__SERVER__BIND=0.0.0.0:9000.
server:
  bind: "127.0.0.1:8080"
exchange:
  # "strict": MIC/ISIN/CUSIP formats and check digits are validated at registration.
  # "permissive": lengths only, for fixtures that need deliberately invalid identifiers.
  identifier_policy: "strict"
  # Commands waiting for the exchange thread. When full, requests fail fast with 503 instead of queueing unbounded.
  command_queue_capacity: 10000
  # Orders and cancellations already queued are committed together, up to max_commands per commit, and each caller
  # is answered after that commit. max_commands: 1 commits every command on its own. max_wait_us > 0 waits that long
  # for more commands once the queue is empty (more grouping, more latency at low load).
  group_commit:
    max_commands: 256
    max_wait_us: 0
# events.simulation_id: optional simulation run ID stamped on every event as simulationId, e.g.
# EXCHANGE__EVENTS__SIMULATION_ID=run-1. Unset by default.
events: {}
webhooks:
  # Look for due deliveries this often when no new event signalled them (this is when retries are picked up).
  poll_interval_ms: 250
  batch_size: 100
  concurrency: 16
  request_timeout_ms: 5000
  # Attempts in total, the first included; then the delivery is dead-lettered (status DEAD).
  max_attempts: 10
  initial_backoff_ms: 500
  max_backoff_ms: 300000
  # Subscriptions declared here are created or updated at startup, by name. Ones removed from this list are disabled,
  # with their history kept. They are read-only through the API (change them here and restart). For example:
  #   - name: settlement
  #     url: http://settlement-service:8080/trades
  #     event_types: [TradeExecuted]
  #     secret_env: SETTLEMENT_WEBHOOK_SECRET   # or secret: "...", or secret_file: /run/secrets/settlement
  #     ordered: true                           # default false
  #     enabled: true                           # default true; false turns it off (no deliveries recorded)
  #     paused: false                           # default false; true records deliveries but holds them
  #     participants: [A, B]                    # optional: only these participants' events, plus events of none
  subscriptions: []
  # When the configuration changes a declared subscription's secret, deliveries are signed with both the new and the
  # previous secret for this long, so the consumer can switch without rejecting any.
  secret_grace_seconds: 3600
# Instruments listed at startup, and again after POST /test/reset, with an InstrumentListed event each: the fields of
# POST /api/instruments in snake_case. A listed one whose enabled or reference_symbol differs is updated
# (InstrumentUpdated), so the configuration wins over API changes at each start. Its other fields cannot change once
# listed: a difference stops startup. Instruments removed from this list stay listed. For example:
#   - id: AAPL
#     symbol: AAPL
#     mic: XNAS
#     currency: USD
#     currency_scale: 2
#     tick_size_minor: 1      # default 1
#     lot_size: 1             # default 1
#     enabled: true           # default true
#     reference_symbol: AAPL  # optional: the symbol a price source quotes it under
#     price_source: { kind: synthetic, initial_price: "187.50" }   # optional; fields left out come from below
instruments: []
# Reference prices. Each instrument's price_source is "none" (no reference price, the default), "fixed" (price) or
# "synthetic" (a seeded geometric Brownian motion: initial_price, drift and volatility annualized, tick_interval_ms
# of simulated time per step, seed). Fields an instrument leaves out come from `default`, field by field.
price_sources:
  seed: 0                     # base of each instrument's derived synthetic seed
  default: { kind: none }
  # Live prices for kind finnhub. The feed runs only with an API key: the FINNHUB_API_KEY environment variable
  # (passed through by the compose files), or api_key_file, which wins when set.
  # The limits are Finnhub's free tier (checked 2026-10-19); the free tier is for personal, non-commercial use.
  finnhub:
    api_key_file: null
    ws_url: "wss://ws.finnhub.io"
    rest_url: "https://finnhub.io/api/v1"
    stale_after_ms: 120000      # real time without an update before a price is stale; longer than refresh_after_ms
    refresh_after_ms: 60000     # real time without an update before a symbol is refreshed over REST
    max_updates_per_second: 4   # reference price updates taken in per instrument; the latest wins
    max_symbols: 50
    rest_calls_per_minute: 60
    request_timeout_ms: 10000
    reconnect_initial_ms: 1000  # backoff, doubled per failure up to reconnect_max_ms, with jitter
    reconnect_max_ms: 60000
    # Append every adopted price to this file in the replay format, to replay the session later. Keep recordings
    # under recordings/ (gitignored): vendor data must not be committed.
    record_to: null
  # Recorded prices for kind replay: CSV (timestamp,referenceSymbol,price,volume) or JSON lines, played on the clock
  # from when each instrument's source starts.
  replay:
    file: null
    loop: false
    loop_gap_ms: 1000
# The built-in liquidity provider: a participant that quotes a ladder of limit orders around each instrument's
# reference price. Off unless an instrument's liquidity (or the default here) sets mode: on. Fields: levels,
# spread_bps, level_step_ticks, level_quantity (lots), level_quantity_growth, requote_threshold_ticks, refill_delay_ms
# (simulated), skew_bps_per_lot, max_inventory (lots), stale_policy (keep, widen or pull; default pull),
# stale_widen_factor, closed_policy (the same, outside the market's session), closed_widen_factor.
liquidity:
  participant_id: "LP"
  # Publish its order lifecycle (accepted, filled, cancelled); its trades are published either way.
  emit_order_events: false
  default: { mode: off }
# Trading sessions by MIC: open and close local time on weekdays. Outside a session client orders are rejected
# (MARKET_CLOSED), DAY orders expire at the close, and the liquidity provider applies its closed_policy. A market not
# listed is always open. For example:
#   sessions:
#     XNAS: { open: "09:30", close: "16:00", time_zone: America/New_York }
# A market is closed on `clearing.holidays`, unless its session lists its own: `holidays: ["2030-12-24"]`, or `[]` for
# a market that trades on every weekday.
sessions: {}
market_data:
  # Per subscriber, instrument and kind (quote, trade, reference), at most one stream message this often, the latest;
  # 0 sends every message. The snapshot is never conflated.
  conflation_interval_ms: 0
  # Messages a stream subscriber may fall behind. Half as far behind, its backlog is collapsed; this far, it is closed.
  stream_buffer: 1024
ids:
  # "random": UUIDv7, different every run. "deterministic": every ID (orders, executions, events, deliveries,
  # subscriptions, reports) is derived from `seed` and the order of commands, so the same commands give the same IDs
  # run after run. Use it for reproducible tests and scenarios.
  mode: "random"
  seed: 0
settlement:
  # "external": no simulation; an external service owns settlement. "simulated": the built-in simulator creates a
  # settlement instruction per trade and emits Settlement* lifecycle events. "both": simulator plus externally
  # reported outcomes, kept apart.
  mode: "external"
  # How often the simulator takes in new trades and fires due transitions (each clock change also does).
  tick_interval_ms: 250
  seed: 1
  # T+N business days (weekends skipped) from the trade date to the intended settlement date. T+1 is the cycle in the
  # US, Canada and Mexico since May 2024; the EU, UK and Switzerland move to it on 2027-10-11.
  settlement_days: 1
  # Markets on another cycle, by MIC (the instrument's `mic`). For example, until 2027-10-11:
  #   market_settlement_days: { XCSE: 2, XSTO: 2 }
  # or EXCHANGE__SETTLEMENT__MARKET_SETTLEMENT_DAYS__XCSE=2.
  market_settlement_days: {}
  reject_probability: 0.0
  cancel_probability: 0.0
  fail_probability: 0.02
  delay_probability: 0.05
  correct_probability: 0.0
  max_delay_days: 3
  max_delays: 2
  correction_days: 1
clearing:
  # End-of-day clearing statements: at `cutoff` (local time in `time_zone`) on each business day, one
  # ClearingStatementIssued per participant that traded since the previous cutoff, with its trades and net obligations
  # per instrument and settlement date. Off by default. Runs on the domain clock, like settlement.
  enabled: false
  cutoff: "17:30"
  time_zone: "UTC"           # an IANA name, e.g. Europe/Copenhagen
  # Dates that are not business days, e.g. ["2030-12-24", "2030-12-25"] (whether or not clearing is enabled): no
  # BusinessDayClosed, ClosingPriceIssued or clearing statement for them, trade dates and settlement dates skip them,
  # and markets are closed on them. GET /api/calendar lists them; a gateway with calendar.mode: follow uses them.
  holidays: []
  # Seeded reconciliation breaks, all off by default. They change what statements say, never the trades.
  breaks:
    seed: 1
    omit_probability: 0.0     # per trade line: left out
    alter_probability: 0.0    # per trade line: quantity or price off by one
    phantom_probability: 0.0  # per statement: a trade that does not exist
    late_probability: 0.0     # per statement: issued 1..max_late_minutes after the cutoff
    max_late_minutes: 60
clock:
  # "system": domain time is real time. "virtual": a controllable clock for simulations and tests. It starts at
  # `start` (default: the real time at first startup), frozen unless `running: true`, and resumes from its last
  # reading after a restart. Webhook delivery scheduling always uses real time.
  mode: "system"
  # Virtual clock only: simulated seconds per real second while it runs. 1440 makes a day pass in a minute, for
  # demos that settle T+1 trades within a minute or two. The system clock accepts only 1.
  speed: 1
  # Mounts POST /api/clock/speed, /freeze and /resume, for changing a showcase's clock without test control.
  # GET /api/clock is always mounted.
  operator_control: false
test_control:
  # Mounts /test/... (virtual clock controls). Never enable outside test deployments.
  enabled: false
database:
  # "durable": every acknowledged command is synced to disk (WAL, synchronous=FULL).
  # "fast": synced only at checkpoints (synchronous=NORMAL). Survives process and container restarts; a host crash or
  #   power loss can lose the last commits, but never corrupts the database.
  # "memory": an in-memory database. Nothing survives the process. path is unused.
  mode: "durable"
  path: "data/exchange.db"
  # memory mode only: the most the database may grow to, in MiB.
  memory_max_mib: 4096
  busy_timeout_ms: 5000
  # "background": a separate connection checkpoints the WAL once it holds checkpoint_pages pages, so no commit waits
  # for a checkpoint. "inline": SQLite's automatic checkpoint, run inside the commit that crosses 1000 pages.
  checkpoint: "background"
  checkpoint_pages: 1000
logging:
  # Used when RUST_LOG is unset.
  filter: "info"
  # "pretty" or "json".
  format: "pretty"
