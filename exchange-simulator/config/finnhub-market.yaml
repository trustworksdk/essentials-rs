# A live market: 37 large US stocks and ETFs and 3 crypto pairs, priced by Finnhub (price source kind finnhub).
#
# Use it as the configuration file. The image ships it at /etc/exchange/finnhub-market.yaml:
#   FINNHUB_API_KEY=<key> EXCHANGE_CONFIG=/etc/exchange/finnhub-market.yaml \
#     docker compose -f exchange-simulator/compose.yaml up --build
# or from a checkout:
#   FINNHUB_API_KEY=<key> EXCHANGE_CONFIG=exchange-simulator/config/finnhub-market.yaml cargo run -p exchange-simulator
#
# - 40 symbols, within Finnhub's free-tier limit of 50 websocket symbols (price_sources.finnhub.max_symbols).
# - US stocks stream trades during US market hours (09:30-16:00 New York); outside them the REST quote keeps the
#   last price fresh, so prices hold still. The crypto pairs trade around the clock, for demos at any hour.
# - The crypto pairs are quoted in USDT on Binance and listed here as USD.
# - Copy the file and edit it for a different market; the service reads one configuration file (EXCHANGE_CONFIG).
#   Instruments listed once stay listed: removing one here does not delist it from an existing database.

price_sources:
  default: { kind: finnhub }

# The liquidity provider is off by default. To give every instrument a counterparty, uncomment:
# liquidity:
#   default: { mode: on, levels: 5, spread_bps: 5, level_quantity: 100, stale_policy: pull }

