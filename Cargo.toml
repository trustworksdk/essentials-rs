# Root of the essentials-rs workspace — the Rust counterpart of essentials-project's
# parent pom.xml. Each component is a member crate in its own subfolder.
[workspace]
resolver = "3"
members = [
    "durable-queues-rs",
    "exchange-simulator",
    "simulator-kit",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/trustworksdk/essentials-rs"
