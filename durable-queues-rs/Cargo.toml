[package]
name = "durable-queues-rs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
fastrand = "2.5.0"
futures-util = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.153"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "json", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
uuid = { version = "1.28.0", features = ["v7"] }

[dev-dependencies]
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "process", "io-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[features]
# Phase 6: the `interop` binary and the Java <-> Rust tests in tests/interop.rs (they need Docker and build the Java
# harness image). Run with `cargo test --features interop --test interop`.
interop = []

[[bin]]
name = "interop"
required-features = ["interop"]

[[test]]
name = "interop"
required-features = ["interop"]
